[project]
name = "canary"
version = "0.4.0"
description = "Catch silent failures in LLM apps and agents: deterministic verdicts, LLM judges that must pass calibration before they score, and run diffs checked against a recorded ruler. Provider-neutral; reads no API keys."
readme = "README.md"
# No contact email by design: all communication goes through the GitHub
# repository (issues, and private vulnerability reports; see SECURITY.md).
authors = [
    { name = "Sergey Krivov" }
]
# Canary's own code is MIT; the five bundled rubric seeds under
# src/canary/rubrics/ are Elastic-2.0 (see THIRD_PARTY_NOTICES.md).
license = "MIT AND Elastic-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]
classifiers = [
    # The bare name "canary" on PyPI belongs to an unrelated project, so this
    # distribution is installed from its Git repository or a release wheel.
    # The classifier makes any accidental registry upload fail.
    "Private :: Do Not Upload",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/skrivov/canary"
Issues = "https://github.com/skrivov/canary/issues"

[project.optional-dependencies]
schema = [
    "jsonschema>=4.21",
]

[tool.uv]
# Contributors only: new enough for the pinned uv_build backend below.
required-version = ">=0.12.5"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
